name: immich

services:
  web:
    image: immich:local
    ports:
      - 2283:2283
    env:
      - DB_HOSTNAME=db
      - DB_USERNAME=immich
      - DB_PASSWORD=immich-pass
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis
      - NODE_ENV=production
      - DB_VECTOR_EXTENSION=vectorchord
    volumes:
      - immich-upload:/usr/src/app/upload
    network: immich-net
    aliases:
      - web
    depends_on:
      - db
      - redis
    restart: always
    healthcheck: CMD-SHELL pgrep -f node || exit 0

  db:
    image: immich-postgres:local
    env:
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD=immich-pass
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - immich-db:/var/lib/postgresql
      - immich-db-run:/var/run/postgresql
    network: immich-net
    aliases:
      - db
    restart: always
    healthcheck: CMD-SHELL pg_isready -U immich || exit 0

  redis:
    image: redis:local
    volumes:
      - immich-redis:/data
    network: immich-net
    aliases:
      - redis
    restart: always
    healthcheck: CMD-SHELL redis-cli ping || exit 0

networks:
  - immich-net
