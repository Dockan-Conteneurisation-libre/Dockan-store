name: prestashop
services:
  web:
    image: prestashop:local
    ports:
      - 8090:80
    env:
      - DB_SERVER=db
      - DB_NAME=prestashop
      - DB_USER=prestashop
      - DB_PASSWD=prestashop-pass
      - PS_INSTALL_AUTO=1
      - PS_DOMAIN=localhost:8090
      - PS_DEV_MODE=0
      - ADMIN_MAIL=admin@example.com
      - ADMIN_PASSWD=adminpass123
    command: sh -c "mkdir -p /var/www/html/var/cache /var/www/html/var/logs && chown -R www-data:www-data /var/www/html/var && docker-php-entrypoint /tmp/docker_run.sh"
    volumes:
      - prestashop-data:/var/www/html
    network: prestashop-net
    aliases:
      - web
    depends_on:
      - db
    restart: always
    healthcheck: CMD-SHELL pgrep -f apache2 || pgrep -f php-fpm || exit 0
  db:
    image: mariadb:local
    env:
      - MYSQL_DATABASE=prestashop
      - MYSQL_USER=prestashop
      - MYSQL_PASSWORD=prestashop-pass
      - MYSQL_ROOT_PASSWORD=change-root
    volumes:
      - prestashop-db:/var/lib/mysql
      - prestashop-db-run:/run/mysqld
    network: prestashop-net
    aliases:
      - db
    restart: always
    healthcheck: CMD-SHELL mariadb-admin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" || exit 0
networks:
  - prestashop-net
