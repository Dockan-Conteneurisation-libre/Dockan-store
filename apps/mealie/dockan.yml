name: mealie
services:
  web:
    image: mealie:local
    ports:
      - 9925:9000
    env:
      - ALLOW_SIGNUP=true
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
      - BASE_URL=http://localhost:9925
    volumes:
      - mealie-data:/app/data
    network: mealie-net
    aliases:
      - web
    restart: always
    healthcheck: CMD-SHELL curl -fsS http://127.0.0.1:9000/ >/dev/null || exit 1
networks:
  - mealie-net
