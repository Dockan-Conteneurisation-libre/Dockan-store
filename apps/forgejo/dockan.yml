name: forgejo
services:
  web:
    image: forgejo:local
    ports:
      - 3004:3000
      - 2223:22
    env:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=forgejo-pass
      - FORGEJO__server__DOMAIN=localhost
      - FORGEJO__server__ROOT_URL=http://localhost:3004
    volumes:
      - forgejo-data:/data
      - forgejo-run:/run
    network: forgejo-net
    aliases:
      - web
    depends_on:
      - db
    restart: always
    healthcheck: CMD-SHELL pgrep -f forgejo || exit 0
  db:
    image: postgres:local
    env:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=forgejo-pass
      - POSTGRES_DB=forgejo
    volumes:
      - forgejo-db:/var/lib/postgresql
      - forgejo-db-run:/var/run/postgresql
    network: forgejo-net
    aliases:
      - db
    restart: always
    healthcheck: CMD-SHELL pg_isready -U forgejo || exit 0
networks:
  - forgejo-net
