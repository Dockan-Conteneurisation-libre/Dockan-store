name: plausible
services:
  web:
    image: plausible:local
    ports:
      - 8091:8000
    env:
      - BASE_URL=http://localhost:8091
      - SECRET_KEY_BASE=changeme-generate-with-openssl-rand-hex-64
      - DATABASE_URL=postgres://plausible:plausible-pass@db:5432/plausible
      - CLICKHOUSE_DATABASE_URL=http://clickhouse:8123/plausible
    network: plausible-net
    aliases:
      - web
    depends_on:
      - db
      - clickhouse
    restart: always
    healthcheck: CMD-SHELL curl -fsS http://127.0.0.1:8000/ >/dev/null || exit 1
  db:
    image: postgres:local
    env:
      - POSTGRES_USER=plausible
      - POSTGRES_PASSWORD=plausible-pass
      - POSTGRES_DB=plausible
    volumes:
      - plausible-db:/var/lib/postgresql/data
    network: plausible-net
    aliases:
      - db
    restart: always
    healthcheck: CMD-SHELL pg_isready -U plausible
  clickhouse:
    image: clickhouse:local
    volumes:
      - plausible-clickhouse:/var/lib/clickhouse
    network: plausible-net
    aliases:
      - clickhouse
    restart: always
networks:
  - plausible-net
