name: jellyfin
services:
  web:
    image: jellyfin:local
    ports:
      - 8096:8096
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./media:/media
    network: jellyfin-net
    aliases:
      - web
    restart: always
    healthcheck: CMD-SHELL pgrep -f jellyfin || exit 0
networks:
  - jellyfin-net
